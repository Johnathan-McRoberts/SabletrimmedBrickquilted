<mat-form-field>
  <mat-label>Document Type</mat-label>
  <mat-select [(ngModel)]="selectedDocType" (ngModelChange)="onDocSelection()">
    @for (docType of documentTypes; track docType) {
    <mat-option [value]="docType.name">{{docType.name}} ( {{docType.description}} )</mat-option>
    }
  </mat-select>
</mat-form-field>
